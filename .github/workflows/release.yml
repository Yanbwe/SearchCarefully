name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: 获取Gradle包装器
        uses: gradle/gradle-build-action@v2
        with:
          gradlew-args: --version

      - name: 添加执行权限
        run: chmod +x gradlew

      - name: 构建模组
        run: ./gradlew build

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 获取tag描述
        id: body
        run: echo "BODY=$(git tag -l --format='%(contents)' ${{ steps.version.outputs.VERSION }})" >> $GITHUB_OUTPUT

      - name: 创建Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: RarityCore-${{ steps.version.outputs.VERSION }}
          body: ${{ steps.body.outputs.BODY }}
          draft: false
          prerelease: false
          files: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
